name: Release

# Publishes to npm when a version tag (v0.1.0, v1.2.3-beta.1, …) is pushed for a
# commit on main. Version the packages first, on a branch, and merge to main:
#
#   pnpm changeset version          # bumps package.json versions, writes CHANGELOGs
#   git commit -am "Release v0.1.0" && merge into main
#   git tag v0.1.0 <main commit> && git push origin v0.1.0
#
# Every package must already carry the tag's version; versions already on npm are skipped.

on:
  push:
    tags: ["v*"]

concurrency: release

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the tag is on main and matches the package versions
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            actual=$(node -p "require('./$pkg').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$pkg is at $actual, but the tag is $GITHUB_REF_NAME. Run pnpm changeset version first."
              exit 1
            fi
          done
      - name: Check the npm token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret (an npm token that can publish to the @javaabu scope)."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npm
        # Pre-release tags (v1.0.0-beta.1) publish under the "next" dist-tag, not "latest".
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          pnpm --filter "./packages/*" -r publish --access public --tag "$tag" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm only signs provenance for public repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
